# /etc/nginx/sites-available/mrgin
# Example: api.mrgin.me → backend droplet
#   sed 's/YOUR_DOMAIN/api.mrgin.me/' deploy/nginx/mrgin.conf | sudo tee /etc/nginx/sites-available/mrgin
#   sudo ln -sf /etc/nginx/sites-available/mrgin /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.mrgin.me

upstream mrgin_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream mrgin_indexer {
    server 127.0.0.1:3002;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    client_max_body_size 4m;

    location /webhook {
        proxy_pass http://mrgin_indexer/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://mrgin_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
